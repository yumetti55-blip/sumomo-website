<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sumomo Website</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        color: #3d2632;
        background: linear-gradient(135deg, #fff4f7, #fce0eb);
      }

      main {
        width: min(90%, 680px);
        padding: 4rem 2rem;
        text-align: center;
        background: rgb(255 255 255 / 85%);
        border: 1px solid rgb(255 255 255 / 90%);
        border-radius: 1.5rem;
        box-shadow: 0 1rem 3rem rgb(118 47 79 / 12%);
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 6vw, 3.5rem);
        letter-spacing: 0.05em;
      }

      p {
        margin: 0;
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ようこそ</h1>
      <p>Sumomo Websiteへようこそ。ここからサイトを始められます。</p>
    </main>
  </body>
</html>
