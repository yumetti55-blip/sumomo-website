<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="日本の妖怪を、見る・探す・遊ぶためのメインページ。" />

    <style>
      :root { color-scheme: dark; font-family: "Yu Mincho", "Hiragino Mincho ProN", serif; color: #eee2d8; background: #0b090e; }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { min-width: 320px; margin: 0; line-height: 1.75; background: #0b090e; background-image: radial-gradient(circle at 12% 0%, rgb(103 28 45 / 52%), transparent 32rem), radial-gradient(circle at 92% 15%, rgb(35 40 65 / 58%), transparent 28rem), repeating-linear-gradient(0deg, rgb(255 255 255 / 1.5%) 0 1px, transparent 1px 4px); }
      body::before { position: fixed; inset: 0; z-index: -1; content: ""; pointer-events: none; background: radial-gradient(ellipse at center, transparent 42%, rgb(0 0 0 / 50%) 100%); }
      a { color: inherit; }
      .page-shell { width: min(92%, 1080px); margin-inline: auto; }
      .menu-toggle { position: fixed; z-index: 60; top: 1rem; left: 1rem; display: grid; width: 2.9rem; height: 2.9rem; place-content: center; gap: 0.28rem; padding: 0; color: #f3e5d6; background: rgb(11 9 14 / 88%); border: 1px solid rgb(219 163 108 / 62%); border-radius: 0.25rem; box-shadow: 0 0.5rem 1.2rem rgb(0 0 0 / 40%), 0 0 1rem rgb(186 62 85 / 20%); cursor: pointer; }
      .menu-toggle:hover, .menu-toggle:focus-visible { color: #0b090e; background: #eab47d; }
      .menu-toggle:focus-visible { outline: 2px solid #f3d0a8; outline-offset: 3px; }
      .menu-toggle span { display: block; width: 1.35rem; height: 2px; background: currentColor; transition: transform 180ms ease, opacity 180ms ease; }
      .menu-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(0.38rem) rotate(45deg); }
      .menu-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
      .menu-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-0.38rem) rotate(-45deg); }
      .menu-drawer { position: fixed; z-index: 55; inset: 0 auto 0 0; width: min(20rem, 86vw); padding: 5.4rem 1.25rem 2rem; overflow-y: auto; background: linear-gradient(165deg, #1b0d16, #0b090e 72%); border-right: 1px solid rgb(186 62 85 / 65%); box-shadow: 1rem 0 3rem rgb(0 0 0 / 48%); transform: translateX(-105%); transition: transform 220ms ease; }
      .menu-drawer.is-open { transform: translateX(0); }
      .menu-drawer p { margin: 0 0 0.8rem; color: #dba36c; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.18em; }
      .menu-drawer ul { display: grid; gap: 0.3rem; margin: 0; padding: 0; list-style: none; }
      .menu-drawer a { display: block; padding: 0.55rem 0.65rem; color: #eee2d8; border: 1px solid transparent; border-radius: 0.2rem; font-size: 0.9rem; text-decoration: none; }
      .menu-drawer a:hover, .menu-drawer a:focus-visible { color: #f3d0a8; background: rgb(186 62 85 / 16%); border-color: rgb(186 62 85 / 56%); }
      .menu-backdrop { position: fixed; z-index: 50; inset: 0; background: rgb(0 0 0 / 62%); opacity: 0; pointer-events: none; transition: opacity 220ms ease; }
      .menu-backdrop.is-open { opacity: 1; pointer-events: auto; }
      body.menu-open { overflow: hidden; }
      .page-transition { position: fixed; z-index: 70; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(circle at 50% 42%, rgb(103 28 45 / 24%), transparent 38%), linear-gradient(135deg, #08060b 0%, #321326 48%, #08060b 100%); background-position: 0% 50%; background-size: 180% 180%; transition: opacity 1.2s ease, background-position 1.2s ease; }
      body.is-leaving .page-transition { opacity: 1; background-position: 100% 50%; }
      body.is-leaving .hero { filter: blur(2px); transform: scale(1.015); transition: filter 1.2s ease, transform 1.2s ease; }
      .hero { position: relative; display: grid; min-height: 82vh; align-content: center; padding: 7rem 0 4.2rem; text-align: center; }
      .hero::after { position: absolute; right: 5%; bottom: 0; width: 22rem; height: 11rem; content: ""; opacity: 0.32; background: radial-gradient(ellipse at center, transparent 42%, #000 44% 48%, transparent 50%), repeating-radial-gradient(ellipse at center, transparent 0 1.1rem, rgb(186 62 85 / 22%) 1.15rem 1.2rem); filter: blur(1px); pointer-events: none; }
      .hero > * { position: relative; z-index: 1; }
      .eyebrow { margin: 0 0 0.7rem; color: #dba36c; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.24em; }
      h1, h2, h3 { line-height: 1.3; }
      h1 { margin: 0; color: #f3e5d6; font-size: clamp(2.6rem, 9vw, 5.8rem); letter-spacing: 0.16em; text-shadow: 0.08em 0.08em 0 #421827, 0 0 1.8rem rgb(186 62 85 / 22%); }
      .lead { max-width: 44rem; margin: 1.4rem auto 0; color: #d7cdd5; font-size: 1.04rem; }
      footer { padding: 1rem 0 2.5rem; color: #9f93a2; font-size: 0.8rem; text-align: center; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; } }
      @media (max-width: 520px) { .hero { min-height: 78vh; padding-top: 6rem; } }
    </style>
  </head>
  <body>
    <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="目次を開く"><span></span><span></span><span></span></button>
    <div class="menu-backdrop" id="menu-backdrop" aria-hidden="true"></div>
    <div class="page-transition" aria-hidden="true"></div>
    <nav class="menu-drawer" id="site-menu" aria-label="サイト目次">

      </ul>
    </nav>

    <main class="hero page-shell">
      <p class="eyebrow">FOLKLORE OF JAPAN</p>
      <h1>百鬼夜行へ</h1>
      <p class="lead">日本の妖怪をめぐる夜へ。<br />詳しいページは、左上の ☰ から。</p>
    </main>
    <footer>妖怪の伝承を通して、日本の文化と想像力を楽しもう。</footer>
    <script>
      (() => {
        const menuToggle = document.getElementById("menu-toggle");
        const menu = document.getElementById("site-menu");
        const backdrop = document.getElementById("menu-backdrop");
        const fadeDuration = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 50 : 1200;
        const navigationTimer = window.setTimeout(() => {
          document.body.classList.add("is-leaving");
          window.setTimeout(() => window.location.assign("guide.html"), fadeDuration);
        }, 5000);

        function closeMenu() {
          menu.classList.remove("is-open");
          backdrop.classList.remove("is-open");
          backdrop.setAttribute("aria-hidden", "true");
          menuToggle.setAttribute("aria-expanded", "false");
          menuToggle.setAttribute("aria-label", "目次を開く");
          document.body.classList.remove("menu-open");
        }
        menuToggle.addEventListener("click", () => {
          const open = menuToggle.getAttribute("aria-expanded") === "true";
          if (open) closeMenu();
          else {
            menu.classList.add("is-open");
            backdrop.classList.add("is-open");
            backdrop.setAttribute("aria-hidden", "false");
            menuToggle.setAttribute("aria-expanded", "true");
            menuToggle.setAttribute("aria-label", "目次を閉じる");
            document.body.classList.add("menu-open");
          }
        });
        backdrop.addEventListener("click", closeMenu);
        menu.querySelectorAll("a").forEach((link) => link.addEventListener("click", () => {
          window.clearTimeout(navigationTimer);
          closeMenu();
        }));
        document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeMenu(); });
      })();
    </script>
  </body>
</html>
